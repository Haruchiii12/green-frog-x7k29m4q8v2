<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ecebd5">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
<title>Happy National Boyfriend's Day 💚</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="app" aria-live="polite">
  <section class="screen active" data-page="1">
    <img class="page-art" src="page1.png" alt="Happy National Boyfriend's Day">
    <button class="img-btn yes" data-go="3" aria-label="Yes of Course"><img src="yes.png" alt="Yes of Course"></button>
    <button class="img-btn no" data-go="2" aria-label="No Thank You"><img src="no.png" alt="No Thank You"></button>
  </section>

  <section class="screen" data-page="2">
    <img class="page-art" src="page2.png" alt="No? Try again">
    <button class="img-btn try" data-go="1" aria-label="Try again"><img src="try.png" alt="Try again"></button>
  </section>

  <section class="screen" data-page="3">
    <img class="page-art" src="page3.png" alt="You said yes. Pick one">
    <button class="img-btn gift g1" data-go="4" aria-label="Gift 1"><img src="gift1.png" alt="1"></button>
    <button class="img-btn gift g2" data-go="5" aria-label="Gift 2"><img src="gift2.png" alt="2"></button>
    <button class="img-btn gift g3" data-go="6" aria-label="Gift 3"><img src="gift3.png" alt="3"></button>
  </section>

  <section class="screen" data-page="4">
    <img class="page-art" src="page4.png" alt="Gift one">
    <button class="img-btn click" data-go="3" aria-label="Back to gifts"><img src="click.png" alt="Click me"></button>
  </section>

  <section class="screen" data-page="5">
    <img class="page-art" src="page5.png" alt="Gift two">
    <button class="img-btn click" data-go="3" aria-label="Back to gifts"><img src="click.png" alt="Click me"></button>
  </section>

  <section class="screen" data-page="6">
    <img class="page-art" src="page6.png" alt="A song for you">
    <button class="img-btn click" data-go="3" aria-label="Back to gifts"><img src="click.png" alt="Click me"></button>
  </section>
</main>
<script src="script.js"></script>
</body>
</html>
